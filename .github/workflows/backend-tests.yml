name: Backend tests

# The feature standard (CONTRIBUTING.md) requires tests to accompany every change and
# the whole suite to pass. This workflow is what enforces it on pull requests.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: backline
          POSTGRES_PASSWORD: backline_ci
          POSTGRES_DB: backline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://backline:backline_ci@localhost:5432/backline_test
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      JWT_EXPIRES_IN: 1h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # vitest.config.ts loads .env.test; in CI the values come from `env:` above.
      - name: Write test env
        run: |
          printf 'DATABASE_URL="%s"\nJWT_SECRET="%s"\nJWT_EXPIRES_IN="%s"\n' \
            "$DATABASE_URL" "$JWT_SECRET" "$JWT_EXPIRES_IN" > .env.test

      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
